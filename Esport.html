<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071030">
<title>Suivi Karmine Corp</title>
<style>
  :root {
    --bg: #071030;
    --panel: #101b4a;
    --panel2: #17255f;
    --ink: #f2f6ff;
    --muted: #93a3d6;
    --blue: #2f8cff;
    --win: #35d08a;
    --loss: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px calc(env(safe-area-inset-bottom, 0px) + 32px); }
  main { max-width: 560px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 2.1rem; line-height: 1; letter-spacing: -.02em; font-weight: 900; }
  header h1 span { color: var(--blue); }
  header p { margin: 6px 0 18px; color: var(--muted); }

  .chips, .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar, .tabs::-webkit-scrollbar { display: none; }
  button { font: inherit; cursor: pointer; }
  .chip { flex: none; border: 2px solid var(--panel2); background: none; color: var(--muted);
    border-radius: 999px; padding: 10px 16px; font-weight: 800; }
  .chip[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
  .chip:disabled { opacity: .45; cursor: default; }
  .tabs { margin: 16px 0 14px; background: var(--panel); border-radius: 16px; padding: 4px; }
  .tab { flex: 1; border: 0; background: none; color: var(--muted); padding: 12px 8px; border-radius: 12px; font-weight: 800; white-space: nowrap; }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  .list { display: grid; gap: 10px; }
  .card { background: var(--panel); border-radius: 18px; padding: 16px; }
  .sub { color: var(--muted); font-size: .9rem; margin: 0 0 10px; font-weight: 600; }
  h2 { font-size: 1.05rem; margin: 22px 0 10px; }
  h2:first-child { margin-top: 0; }

  .player { display: flex; align-items: center; gap: 14px; }
  .role { flex: none; width: 54px; height: 54px; border-radius: 16px; background: var(--blue);
    display: grid; place-items: center; font-weight: 900; font-size: .95rem; }
  .player b { font-size: 1.15rem; display: block; }
  .player small { color: var(--muted); font-weight: 600; }

  .match { display: grid; gap: 6px; }
  .match .when { color: var(--muted); font-size: .9rem; font-weight: 700; }
  .vs { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 800; font-size: 1.1rem; }
  .vs .score { font-size: 1.5rem; }
  .badge { display: inline-block; border-radius: 999px; padding: 4px 10px; font-size: .8rem; font-weight: 800; }
  .badge.win { background: rgba(53,208,138,.16); color: var(--win); }
  .badge.loss { background: rgba(255,107,107,.16); color: var(--loss); }
  .badge.live { background: rgba(255,208,0,.18); color: #ffd000; }
  .meta { color: var(--muted); font-size: .88rem; font-weight: 600; }

  .setup input { width: 100%; font: inherit; padding: 14px; border-radius: 12px; border: 2px solid var(--panel2);
    background: var(--bg); color: var(--ink); margin: 8px 0 10px; }
  .btn { border: 0; background: var(--blue); color: #fff; border-radius: 12px; padding: 14px 18px; font-weight: 800; width: 100%; }
  .btn.ghost { background: var(--panel2); margin-top: 8px; }
  a { color: var(--blue); font-weight: 700; }
  .note { color: var(--muted); font-size: .88rem; line-height: 1.45; margin-top: 18px; }
  .err { color: var(--loss); font-weight: 700; }
  .empty { color: var(--muted); text-align: center; padding: 22px 8px; font-weight: 600; }

  button.card { width: 100%; border: 0; color: inherit; font: inherit; text-align: left; }
  button.card.player { position: relative; padding-right: 36px; }
  button.card.player::after { content: "\203A"; position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    font-size: 1.8rem; color: var(--muted); }
  button.card.player:active { background: var(--panel2); }
  .back { border: 0; background: none; color: var(--blue); font-weight: 800; padding: 4px 0 14px; }
  .hero { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
  .hero .role { width: 64px; height: 64px; font-size: 1.05rem; }
  .hero b { font-size: 1.6rem; display: block; line-height: 1.1; }
  .hero small { color: var(--muted); font-weight: 600; }
  .rows { display: grid; gap: 0; }
  .rows div { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--panel2); }
  .rows div:last-child { border-bottom: 0; }
  .rows span:first-child { color: var(--muted); font-weight: 700; flex: none; }
  .rows span:last-child { text-align: right; font-weight: 700; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile { background: var(--panel2); border-radius: 14px; padding: 12px 8px; text-align: center; }
  .tile b { display: block; font-size: 1.3rem; }
  .tile small { color: var(--muted); font-weight: 700; font-size: .78rem; }
  .game { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--panel2); }
  .game:last-child { border-bottom: 0; }
  .game .res { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 900; }
  .game .res.w { background: rgba(53,208,138,.16); color: var(--win); }
  .game .res.l { background: rgba(255,107,107,.16); color: var(--loss); }
  .game .mid { flex: 1; min-width: 0; }
  .game .mid b { display: block; }
  .game .mid small { color: var(--muted); font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .game .kda { text-align: right; font-weight: 800; flex: none; }
  .game .kda small { display: block; color: var(--muted); font-weight: 600; }
  .links { display: grid; gap: 8px; }
  .links a { display: block; background: var(--panel2); border-radius: 12px; padding: 13px 14px; text-decoration: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Karmine <span>Corp</span></h1>
    <p>Matchs, roster et infos de l’équipe.</p>
  </header>

  <div class="chips" id="games" role="group" aria-label="Jeu">
    <button class="chip" data-game="lol" aria-pressed="true">League of Legends</button>
    <button class="chip" disabled>Valorant (bientôt)</button>
    <button class="chip" disabled>TFT (bientôt)</button>
  </div>

  <div class="tabs" id="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="matches" aria-selected="true">Matchs</button>
    <button class="tab" role="tab" data-tab="roster" aria-selected="false">Roster</button>
    <button class="tab" role="tab" data-tab="teams" aria-selected="false">Équipes KC</button>
    <button class="tab" role="tab" data-tab="worlds" aria-selected="false">Worlds</button>
  </div>

  <section id="view"></section>
</main>

<script>
(() => {
  // ------------------------------------------------------------------
  // DONNÉES (à modifier ici quand le roster change)
  // Source : annonces officielles de Karmine Corp du 7-8 janvier 2026.
  // ------------------------------------------------------------------
  const DATA = {
    lol: {
      updated: '8 janvier 2026',
      pageUrl: 'https://liquipedia.net/leagueoflegends/Karmine_Corp',
      roster: [
        { role: 'TOP', pseudo: 'Canna', name: 'Kim Chang-dong', country: '\u{1F1F0}\u{1F1F7}', info: 'Prolongé pour 2026' },
        { role: 'JGL', pseudo: 'Yike', name: 'Martin Sundelin', country: '\u{1F1F8}\u{1F1EA}', info: 'Conservé pour 2026' },
        { role: 'MID', pseudo: 'Kyeahoo', name: 'Kang Yea-hoo', country: '\u{1F1F0}\u{1F1F7}', info: 'Nouvelle recrue 2026' },
        { role: 'ADC', pseudo: 'Caliste', name: 'Caliste Henry-Hennebert', country: '\u{1F1EB}\u{1F1F7}', info: 'Conservé pour 2026',
          born: '2006-08-28', from: 'France (a grandi à Paulhan, près de Montpellier)' },
        { role: 'SUP', pseudo: 'Busio', name: 'Alan Cwalina', country: '\u{1F1FA}\u{1F1F8}', info: 'Nouvelle recrue 2026' }
      ],
      staff: [
        { role: 'Head coach', pseudo: 'Reapered', name: 'Bok Han-gyu' }
      ],
      teams: [
        { name: 'Karmine Corp', league: 'LEC', desc: 'L\u2019équipe première, en ligue européenne (LEC).' },
        { name: 'Karmine Corp Blue', league: 'LFL / LEC Versus', desc: 'L\u2019équipe seconde. Joueurs : Tao, Yukino, Kamiloo, Hazel, Prime.' },
        { name: 'Karmine Corp Blue Stars', league: 'Nexus League', desc: 'Équipe de développement des jeunes de 19 ans et moins. Joueurs : Koala, Oleg, Panda2, looki, Alaric.' }
      ]
    }
  };

  // ------------------------------------------------------------------
  const $ = s => document.querySelector(s);
  const view = $('#view');
  let game = 'lol';
  let tab = 'matches';
  const TOKEN_KEY = 'kc_pandascore_token';

  const getToken = () => { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } };
  const setToken = t => { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) {} };

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };

  // ---------- Roster ----------
  function renderRoster() {
    const d = DATA[game];
    view.textContent = '';
    view.append(el('h2', null, 'Joueurs'));
    const list = el('div', 'list');
    d.roster.forEach(p => {
      const c = el('button', 'card player');
      c.onclick = () => renderPlayer(p);
      c.append(el('div', 'role', p.role));
      const t = el('div');
      const b = el('b', null, p.pseudo + ' ' + p.country);
      t.append(b, el('small', null, p.name), document.createElement('br'), el('small', null, p.info));
      c.append(t);
      list.append(c);
    });
    view.append(list);
    view.append(el('h2', null, 'Staff'));
    const sl = el('div', 'list');
    d.staff.forEach(s => {
      const c = el('div', 'card player');
      c.append(el('div', 'role', 'COACH'));
      const t = el('div');
      t.append(el('b', null, s.pseudo), el('small', null, s.name + ' \u2022 ' + s.role));
      c.append(t);
      sl.append(c);
    });
    view.append(sl);
    const note = el('p', 'note');
    note.append('Roster annoncé le ' + d.updated + '. Un changement de joueur est possible depuis : ');
    const a = el('a', null, 'voir la page à jour');
    a.href = d.pageUrl; a.target = '_blank'; a.rel = 'noopener';
    note.append(a, '.');
    view.append(note);
  }

  // ---------- Fiche joueur ----------
  const ROLE_LABEL = { TOP: 'Toplaner', JGL: 'Jungler', MID: 'Midlaner', ADC: 'ADC (bot)', SUP: 'Support' };
  const LP_API = 'https://lol.fandom.com/api.php';

  async function cargo(params) {
    const q = new URLSearchParams(Object.assign({ action: 'cargoquery', format: 'json', origin: '*' }, params));
    const r = await fetch(LP_API + '?' + q.toString());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (j.error) throw new Error(j.error.info || 'Erreur Leaguepedia');
    return (j.cargoquery || []).map(x => x.title);
  }

  const ageFrom = iso => {
    const b = new Date(iso + 'T00:00:00'); const n = new Date();
    let a = n.getFullYear() - b.getFullYear();
    const m = n.getMonth() - b.getMonth();
    if (m < 0 || (m === 0 && n.getDate() < b.getDate())) a--;
    return a;
  };
  const fmtBirth = iso => new Date(iso + 'T00:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  const kdaOf = (k, d, a) => d === 0 ? 'Parfait' : ((k + a) / d).toFixed(2);
  const pct = (w, n) => n ? Math.round((w / n) * 100) + '%' : '-';

  function renderRows(box, rows) {
    box.textContent = '';
    rows.filter(r => r[1]).forEach(r => {
      const d = el('div');
      d.append(el('span', null, r[0]), el('span', null, r[1]));
      box.append(d);
    });
  }

  function tile(value, label) {
    const t = el('div', 'tile');
    t.append(el('b', null, String(value)), el('small', null, label));
    return t;
  }

  function renderPlayer(p, onBack) {
    view.textContent = '';
    const back = el('button', 'back', '\u2039 Retour');
    back.onclick = onBack || renderRoster;
    view.append(back);

    const hero = el('div', 'hero');
    hero.append(el('div', 'role', p.role));
    const ht = el('div');
    const subName = el('small', null, p.name || '');
    ht.append(el('b', null, p.pseudo + (p.country ? ' ' + p.country : '')), subName);
    hero.append(ht);
    view.append(hero);

    // Infos de base
    const info = { born: p.born || '', from: p.from || '', fav: '' };
    const infoCard = el('div', 'card');
    infoCard.append(el('h2', null, 'Infos'));
    const rowsBox = el('div', 'rows');
    infoCard.append(rowsBox);
    const drawInfo = () => renderRows(rowsBox, [
      ['Nom complet', p.name || ''],
      ['Né(e) le', info.born ? fmtBirth(info.born) : ''],
      ['Âge', info.born ? ageFrom(info.born) + ' ans' : ''],
      ['Origine', info.from],
      ['Rôle', ROLE_LABEL[p.role]],
      ['Équipe', p.team || 'Karmine Corp (LEC)'],
      ['Statut', p.info],
      ['Champions favoris', info.fav]
    ]);
    drawInfo();
    view.append(infoCard);

    // Stats
    const statsCard = el('div', 'card');
    statsCard.style.marginTop = '10px';
    statsCard.append(el('h2', null, 'Statistiques'));
    const statsBody = el('div', null);
    statsBody.append(el('div', 'empty', 'Chargement des stats\u2026'));
    statsCard.append(statsBody);
    view.append(statsCard);

    // Liens
    const linksCard = el('div', 'card');
    linksCard.style.marginTop = '10px';
    linksCard.append(el('h2', null, 'Plus de détails'));
    const links = el('div', 'links');
    [['Leaguepedia (carrière complète)', 'https://lol.fandom.com/wiki/' + encodeURIComponent(p.pseudo)],
     ['Sheep Esports (stats et actus)', 'https://www.sheepesports.com/en/lol/players/' + encodeURIComponent(p.pseudo)]
    ].forEach(l => {
      const a = el('a', null, l[0]); a.href = l[1]; a.target = '_blank'; a.rel = 'noopener';
      links.append(a);
    });
    linksCard.append(links);
    view.append(linksCard);

    // Données en direct (Leaguepedia, sans clé)
    const who = '"' + p.pseudo.replace(/"/g, '') + '"';
    cargo({
      tables: 'Players',
      fields: 'Birthdate,Country,Name,FavChamps',
      where: 'Player=' + who,
      limit: '1'
    }).then(rows => {
      const r = rows[0];
      if (!r) return;
      if (r.Name && !p.name) { p.name = r.Name; subName.textContent = r.Name; }
      if (r.Birthdate && !info.born) info.born = String(r.Birthdate).slice(0, 10);
      if (r.Country && !info.from) info.from = r.Country;
      if (r.FavChamps) info.fav = String(r.FavChamps).split(',').map(s => s.trim()).filter(Boolean).slice(0, 5).join(', ');
      drawInfo();
    }).catch(() => {});

    cargo({
      tables: 'ScoreboardPlayers',
      fields: 'Champion,Kills,Deaths,Assists,PlayerWin,DateTime_UTC,TeamVs,Tournament',
      where: 'Link=' + who,
      order_by: 'DateTime_UTC DESC',
      limit: '500'
    }).then(rows => {
      statsBody.textContent = '';
      if (!rows.length) { statsBody.append(el('div', 'empty', 'Aucune game trouvée pour ce joueur.')); return; }
      const games = rows.map(r => ({
        champ: r.Champion || '?',
        k: Number(r.Kills) || 0, d: Number(r.Deaths) || 0, a: Number(r.Assists) || 0,
        win: r.PlayerWin === 'Yes',
        date: (r['DateTime UTC'] || r.DateTime_UTC || '').replace(' ', 'T') + 'Z',
        vs: r.TeamVs || '', tour: r.Tournament || ''
      }));
      const sum = list => list.reduce((s, g) => ({ k: s.k + g.k, d: s.d + g.d, a: s.a + g.a, w: s.w + (g.win ? 1 : 0) }), { k: 0, d: 0, a: 0, w: 0 });

      const all = sum(games);
      statsBody.append(el('p', 'sub', 'Toutes compétitions confondues (' + games.length + ' games)'));
      const t1 = el('div', 'tiles');
      t1.append(tile(kdaOf(all.k, all.d, all.a), 'KDA'), tile(pct(all.w, games.length), 'Victoires'), tile(games.length, 'Games'));
      statsBody.append(t1);

      const last = games.slice(0, 20);
      const l20 = sum(last);
      statsBody.append(el('p', 'sub', '\u00a0'));
      statsBody.append(el('p', 'sub', '20 dernières games'));
      const t2 = el('div', 'tiles');
      t2.append(tile(kdaOf(l20.k, l20.d, l20.a), 'KDA'), tile(pct(l20.w, last.length), 'Victoires'),
        tile((l20.k / last.length).toFixed(1) + '/' + (l20.d / last.length).toFixed(1) + '/' + (l20.a / last.length).toFixed(1), 'K/D/A moy.'));
      statsBody.append(t2);

      // Champions les plus joués
      const byChamp = {};
      games.forEach(g => { (byChamp[g.champ] = byChamp[g.champ] || []).push(g); });
      const top = Object.entries(byChamp).sort((a, b) => b[1].length - a[1].length).slice(0, 5);
      statsBody.append(el('h2', null, 'Champions les plus joués'));
      const cbox = el('div');
      top.forEach(([name, list]) => {
        const s = sum(list);
        const row = el('div', 'game');
        const mid = el('div', 'mid');
        mid.append(el('b', null, name), el('small', null, list.length + ' games \u2022 ' + pct(s.w, list.length) + ' de victoires'));
        const kd = el('div', 'kda', kdaOf(s.k, s.d, s.a));
        kd.append(el('small', null, 'KDA'));
        row.append(mid, kd);
        cbox.append(row);
      });
      statsBody.append(cbox);

      // Dernières games
      statsBody.append(el('h2', null, 'Dernières games'));
      const gbox = el('div');
      games.slice(0, 10).forEach(g => {
        const row = el('div', 'game');
        row.append(el('div', 'res ' + (g.win ? 'w' : 'l'), g.win ? 'V' : 'D'));
        const mid = el('div', 'mid');
        const when = new Date(g.date);
        const ds = isNaN(when) ? '' : when.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
        mid.append(el('b', null, g.champ + (g.vs ? ' vs ' + g.vs : '')), el('small', null, [ds, g.tour].filter(Boolean).join(' \u2022 ')));
        const kd = el('div', 'kda', g.k + '/' + g.d + '/' + g.a);
        kd.append(el('small', null, kdaOf(g.k, g.d, g.a) + ' KDA'));
        row.append(mid, kd);
        gbox.append(row);
      });
      statsBody.append(gbox);
    }).catch(() => {
      statsBody.textContent = '';
      statsBody.append(el('div', 'empty', 'Impossible de charger les stats pour le moment. Utilise les liens ci-dessous.'));
    });
  }

  // ---------- Worlds 2026 : analyser une équipe ----------
  // Équipes qualifiées au Worlds 2026 (au 30 sept. 2026). `lp` = nom de la page Leaguepedia.
  const WORLDS = [
    { region: 'LCK (Corée)', teams: [
      { name: 'Gen.G', lp: 'Gen.G' }, { name: 'Hanwha Life Esports', lp: 'Hanwha Life Esports' },
      { name: 'T1', lp: 'T1' }, { name: 'Dplus KIA', lp: 'Dplus KIA' } ] },
    { region: 'LPL (Chine)', teams: [
      { name: 'Anyone\u2019s Legend', lp: 'Anyone\'s Legend' }, { name: 'Bilibili Gaming', lp: 'Bilibili Gaming' },
      { name: 'TOP Esports', lp: 'Top Esports' }, { name: 'Invictus Gaming', lp: 'Invictus Gaming' } ] },
    { region: 'LEC (Europe)', teams: [
      { name: 'G2 Esports', lp: 'G2 Esports' }, { name: 'Movistar KOI', lp: 'Movistar KOI' },
      { name: 'Karmine Corp', lp: 'Karmine Corp' } ] },
    { region: 'LCS (Amérique du Nord)', teams: [
      { name: 'Team Liquid', lp: 'Team Liquid' }, { name: 'LYON', lp: 'LYON' }, { name: 'Cloud9', lp: 'Cloud9' } ] },
    { region: 'LCP (Asie-Pacifique)', teams: [
      { name: 'Team Secret Whales', lp: 'Team Secret Whales' }, { name: 'CTBC Flying Oyster', lp: 'CTBC Flying Oyster' },
      { name: 'MVK Esports', lp: 'MVK Esports' } ] },
    { region: 'CBLOL (Brésil)', teams: [
      { name: 'LOS', lp: 'LOS' }, { name: 'FURIA', lp: 'FURIA' } ] }
  ];
  const LP_ROLE = { Top: 'TOP', Jungle: 'JGL', Mid: 'MID', Bot: 'ADC', Support: 'SUP' };
  const ROLE_ORDER = ['Top', 'Jungle', 'Mid', 'Bot', 'Support'];

  function renderWorlds() {
    view.textContent = '';
    view.append(el('p', 'sub', 'Choisis une équipe qualifiée au Worlds 2026 pour l\u2019analyser.'));
    WORLDS.forEach(g => {
      view.append(el('h2', null, g.region));
      const list = el('div', 'list');
      g.teams.forEach(t => {
        const c = el('button', 'card player');
        c.onclick = () => renderTeam(t, g.region);
        const box = el('div');
        box.append(el('b', null, t.name));
        c.append(box);
        list.append(c);
      });
      view.append(list);
    });
    const note = el('p', 'note', 'Liste au 30 septembre 2026. Une place du CBLOL n\u2019était pas encore confirmée à cette date.');
    view.append(note);
  }

  const lpDate = d => d.toISOString().slice(0, 19).replace('T', ' ');
  const lpKey = (r, k) => r[k.replace('_', ' ')] || r[k] || '';
  const q = s => '"' + String(s).replace(/"/g, '') + '"';

  function renderTeam(t, region) {
    view.textContent = '';
    const back = el('button', 'back', '\u2039 Retour aux équipes du Worlds');
    back.onclick = renderWorlds;
    view.append(back);

    const hero = el('div', 'hero');
    const ht = el('div');
    ht.append(el('b', null, t.name), el('small', null, region));
    hero.append(ht);
    view.append(hero);

    // Joueurs titulaires (déduits des games récentes)
    const rosterCard = el('div', 'card');
    rosterCard.append(el('h2', null, 'Les 5 titulaires'));
    const rosterBody = el('div', 'list');
    rosterBody.append(el('div', 'empty', 'Chargement\u2026'));
    rosterCard.append(rosterBody);
    view.append(rosterCard);

    // Prochains matchs
    const nextCard = el('div', 'card');
    nextCard.style.marginTop = '10px';
    nextCard.append(el('h2', null, 'Prochains matchs'));
    const nextBody = el('div');
    nextBody.append(el('div', 'empty', 'Chargement\u2026'));
    nextCard.append(nextBody);
    view.append(nextCard);

    // Derniers matchs
    const lastCard = el('div', 'card');
    lastCard.style.marginTop = '10px';
    lastCard.append(el('h2', null, 'Dernières games'));
    const lastBody = el('div');
    lastBody.append(el('div', 'empty', 'Chargement\u2026'));
    lastCard.append(lastBody);
    view.append(lastCard);

    const linkCard = el('div', 'card');
    linkCard.style.marginTop = '10px';
    const links = el('div', 'links');
    const a = el('a', null, 'Page Leaguepedia de l\u2019équipe');
    a.href = 'https://lol.fandom.com/wiki/' + encodeURIComponent(t.lp.replace(/ /g, '_'));
    a.target = '_blank'; a.rel = 'noopener';
    links.append(a);
    linkCard.append(links);
    view.append(linkCard);

    const team = q(t.lp);
    const since = lpDate(new Date(Date.now() - 150 * 86400000));
    const now = lpDate(new Date());

    cargo({
      tables: 'ScoreboardPlayers',
      fields: 'Link,Role,DateTime_UTC',
      where: 'Team=' + team + ' AND DateTime_UTC >= ' + q(since),
      order_by: 'DateTime_UTC DESC',
      limit: '500'
    }).then(rows => {
      rosterBody.textContent = '';
      const byRole = {};
      rows.forEach(r => {
        const role = r.Role, link = r.Link;
        if (!role || !link) return;
        const m = (byRole[role] = byRole[role] || {});
        m[link] = (m[link] || 0) + 1;
      });
      let found = 0;
      ROLE_ORDER.forEach(role => {
        const m = byRole[role];
        if (!m) return;
        const best = Object.entries(m).sort((x, y) => y[1] - x[1])[0];
        found++;
        const p = { role: LP_ROLE[role], pseudo: best[0], team: t.name + ' (' + region.split(' ')[0] + ')' };
        const c = el('button', 'card player');
        c.style.background = 'var(--panel2)';
        c.onclick = () => renderPlayer(p, () => renderTeam(t, region));
        c.append(el('div', 'role', p.role));
        const box = el('div');
        box.append(el('b', null, p.pseudo), el('small', null, best[1] + ' games sur 150 jours'));
        c.append(box);
        rosterBody.append(c);
      });
      if (!found) rosterBody.append(el('div', 'empty', 'Aucun joueur trouvé. Le nom de l\u2019équipe a peut-être changé sur Leaguepedia.'));
    }).catch(() => {
      rosterBody.textContent = '';
      rosterBody.append(el('div', 'empty', 'Impossible de charger les joueurs pour le moment.'));
    });

    cargo({
      tables: 'MatchSchedule',
      fields: 'Team1,Team2,DateTime_UTC,BestOf,OverviewPage',
      where: '(Team1=' + team + ' OR Team2=' + team + ') AND DateTime_UTC >= ' + q(now),
      order_by: 'DateTime_UTC ASC',
      limit: '5'
    }).then(rows => {
      nextBody.textContent = '';
      if (!rows.length) { nextBody.append(el('div', 'empty', 'Aucun match programmé trouvé.')); return; }
      rows.forEach(r => {
        const row = el('div', 'game');
        const mid = el('div', 'mid');
        const opp = r.Team1 === t.lp ? r.Team2 : r.Team1;
        const d = new Date(lpKey(r, 'DateTime_UTC').replace(' ', 'T') + 'Z');
        const ds = isNaN(d) ? '' : d.toLocaleString('fr-FR', { weekday: 'short', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
        mid.append(el('b', null, 'vs ' + (opp || 'À déterminer')),
          el('small', null, [ds, r.BestOf ? 'BO' + r.BestOf : '', (r.OverviewPage || '').replace(/_/g, ' ')].filter(Boolean).join(' \u2022 ')));
        row.append(mid);
        nextBody.append(row);
      });
    }).catch(() => {
      nextBody.textContent = '';
      nextBody.append(el('div', 'empty', 'Impossible de charger le calendrier.'));
    });

    cargo({
      tables: 'ScoreboardGames',
      fields: 'Team1,Team2,Winner,DateTime_UTC,Tournament',
      where: '(Team1=' + team + ' OR Team2=' + team + ')',
      order_by: 'DateTime_UTC DESC',
      limit: '40'
    }).then(rows => {
      lastBody.textContent = '';
      if (!rows.length) { lastBody.append(el('div', 'empty', 'Aucune game trouvée.')); return; }
      const games = rows.map(r => {
        const isT1 = r.Team1 === t.lp;
        return {
          win: (r.Winner === '1' && isT1) || (r.Winner === '2' && !isT1),
          opp: isT1 ? r.Team2 : r.Team1,
          date: new Date(lpKey(r, 'DateTime_UTC').replace(' ', 'T') + 'Z'),
          tour: r.Tournament || ''
        };
      });
      const wins = games.filter(g => g.win).length;
      const tiles = el('div', 'tiles');
      tiles.append(tile(games.length, 'Games'), tile(pct(wins, games.length), 'Victoires'), tile(wins + '-' + (games.length - wins), 'V-D'));
      lastBody.append(el('p', 'sub', 'Sur les ' + games.length + ' dernières games'), tiles);
      lastBody.append(el('p', 'sub', '\u00a0'));
      games.slice(0, 10).forEach(g => {
        const row = el('div', 'game');
        row.append(el('div', 'res ' + (g.win ? 'w' : 'l'), g.win ? 'V' : 'D'));
        const mid = el('div', 'mid');
        const ds = isNaN(g.date) ? '' : g.date.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
        mid.append(el('b', null, 'vs ' + g.opp), el('small', null, [ds, g.tour].filter(Boolean).join(' \u2022 ')));
        row.append(mid);
        lastBody.append(row);
      });
    }).catch(() => {
      lastBody.textContent = '';
      lastBody.append(el('div', 'empty', 'Impossible de charger les games.'));
    });
  }

  // ---------- Équipes ----------
  function renderTeams() {
    view.textContent = '';
    const list = el('div', 'list');
    DATA[game].teams.forEach(t => {
      const c = el('div', 'card');
      c.append(el('b', null, t.name), el('p', 'sub', t.league), el('div', 'meta', t.desc));
      list.append(c);
    });
    view.append(list);
  }

  // ---------- Matchs (API PandaScore) ----------
  const API = 'https://api.pandascore.co';
  const fmtDate = iso => new Date(iso).toLocaleString('fr-FR', {
    weekday: 'short', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit'
  });

  async function api(path, token) {
    const sep = path.includes('?') ? '&' : '?';
    const r = await fetch(API + path + sep + 'token=' + encodeURIComponent(token));
    if (r.status === 401) throw new Error('Erreur 401 : PandaScore ne reconnaît pas ce token. Régénère-le sur le tableau de bord et colle-le à nouveau.');
    if (r.status === 403) throw new Error('Erreur 403 : ton compte PandaScore n\u2019a pas accès à cette donnée (limite du plan gratuit).');
    if (r.status === 429) throw new Error('Erreur 429 : trop de requêtes, réessaie dans une minute.');
    if (!r.ok) throw new Error('Erreur ' + r.status);
    return r.json();
  }

  function renderSetup(msg) {
    view.textContent = '';
    const c = el('div', 'card setup');
    c.append(el('b', null, 'Activer les matchs en direct'));
    c.append(el('p', 'sub', 'Les dates et résultats viennent de PandaScore. Il faut un token gratuit, stocké uniquement sur ton téléphone.'));
    const input = el('input');
    input.type = 'password'; input.placeholder = 'Colle ton token PandaScore';
    input.setAttribute('autocomplete', 'off');
    const go = el('button', 'btn', 'Enregistrer et charger');
    go.onclick = () => { const v = input.value.replace(/^Bearer\s+/i, '').replace(/[\s"']/g, ''); if (v) { setToken(v); loadMatches(); } };
    c.append(input, go);
    if (msg) c.append(el('p', 'err', msg));
    const help = el('p', 'note');
    help.append('Compte gratuit sur ');
    const a = el('a', null, 'pandascore.co');
    a.href = 'https://app.pandascore.co/'; a.target = '_blank'; a.rel = 'noopener';
    help.append(a, ', puis copie le token depuis le tableau de bord.');
    c.append(help);
    view.append(c);
  }

  function matchCard(m, kcId) {
    const c = el('div', 'card match');
    const opp = (m.opponents || []).map(o => o.opponent).find(o => o.id !== kcId);
    const oppName = opp ? opp.name : 'Adversaire à déterminer';
    const when = m.status === 'running' ? 'En cours' : fmtDate(m.begin_at || m.scheduled_at);
    c.append(el('div', 'when', when));

    const vs = el('div', 'vs');
    vs.append(el('span', null, 'KC vs ' + oppName));
    if (m.status === 'finished' || m.status === 'running') {
      const kc = (m.results || []).find(r => r.team_id === kcId);
      const ot = (m.results || []).find(r => r.team_id !== kcId);
      vs.append(el('span', 'score', (kc ? kc.score : 0) + ' - ' + (ot ? ot.score : 0)));
    }
    c.append(vs);

    const line = el('div');
    if (m.status === 'finished') {
      const won = m.winner_id === kcId;
      line.append(el('span', 'badge ' + (won ? 'win' : 'loss'), won ? 'Victoire' : 'Défaite'));
    } else if (m.status === 'running') {
      line.append(el('span', 'badge live', 'En direct'));
    }
    c.append(line);

    const bits = [];
    if (m.league && m.league.name) bits.push(m.league.name);
    if (m.serie && (m.serie.full_name || m.serie.name)) bits.push(m.serie.full_name || m.serie.name);
    if (m.number_of_games) bits.push('BO' + m.number_of_games);
    if (bits.length) c.append(el('div', 'meta', bits.join(' \u2022 ')));
    return c;
  }

  async function loadMatches() {
    const token = getToken();
    if (!token) { renderSetup(); return; }
    view.textContent = '';
    view.append(el('div', 'empty', 'Chargement\u2026'));
    try {
      const teams = await api('/lol/teams?search[name]=Karmine&per_page=20', token);
      const kc = teams.find(t => t.name.toLowerCase() === 'karmine corp') || teams[0];
      if (!kc) throw new Error('Équipe introuvable.');
      const [next, past] = await Promise.all([
        api('/lol/matches/upcoming?filter[opponent_id]=' + kc.id + '&sort=scheduled_at&per_page=8', token),
        api('/lol/matches/past?filter[opponent_id]=' + kc.id + '&sort=-scheduled_at&per_page=8', token)
      ]);
      const running = await api('/lol/matches/running?filter[opponent_id]=' + kc.id, token).catch(() => []);

      view.textContent = '';
      const upcoming = running.concat(next);
      view.append(el('h2', null, 'Prochains matchs'));
      if (!upcoming.length) {
        view.append(el('div', 'empty', 'Aucun match programmé pour le moment. C\u2019est peut-être la pause entre deux saisons.'));
      } else {
        const l = el('div', 'list');
        upcoming.forEach(m => l.append(matchCard(m, kc.id)));
        view.append(l);
      }
      view.append(el('h2', null, 'Derniers résultats'));
      const l2 = el('div', 'list');
      past.forEach(m => l2.append(matchCard(m, kc.id)));
      if (!past.length) l2.append(el('div', 'empty', 'Pas de résultat récent.'));
      view.append(l2);

      const reset = el('button', 'btn ghost', 'Changer de token');
      reset.onclick = () => { setToken(''); renderSetup(); };
      view.append(reset);
    } catch (e) {
      renderSetup(e.message === 'Failed to fetch'
        ? 'Impossible de joindre PandaScore (réseau ou blocage du navigateur).'
        : e.message);
    }
  }

  // ---------- Navigation ----------
  function render() {
    if (tab === 'matches') loadMatches();
    else if (tab === 'roster') renderRoster();
    else if (tab === 'worlds') renderWorlds();
    else renderTeams();
  }

  $('#tabs').addEventListener('click', e => {
    const b = e.target.closest('.tab');
    if (!b) return;
    tab = b.dataset.tab;
    document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', String(x === b)));
    render();
  });
  $('#games').addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (!b || b.disabled) return;
    game = b.dataset.game;
    document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    render();
  });

  render();
})();
</script>
</body>
</html>
